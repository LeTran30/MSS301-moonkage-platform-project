# Every relative link in the Markdown docs must point to a file that exists (docs/README.md, rule 3).
# Offline: only links inside the repo are checked, so the job is fast and never flaky.
name: Docs links

on:
  pull_request:
    paths: ['**/*.md', 'api/**/*.java', '.github/workflows/docs-links.yml']
  push:
    branches: [main, develop]
    paths: ['**/*.md', 'api/**/*.java', '.github/workflows/docs-links.yml']

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true

      # Tài liệu class nặng là tài liệu sinh tay: class bị đổi tên hoặc xoá thì
      # tài liệu phải được sửa theo (docs/README.md, quy tắc 9).
      - name: Check class docs match source
        run: node docs/scripts/check-class-docs.mjs