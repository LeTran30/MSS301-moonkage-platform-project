# Final gate: every pull request must pass Spotless + Checkstyle + Error Prone + tests.
# Git hooks can be skipped (git commit --no-verify); CI cannot.
name: Code quality

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/code-quality.yml']
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/code-quality.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # validate: Spotless check + Checkstyle; compile: Error Prone; then tests
      - name: Build and check
        run: ./mvnw -B -ntp clean verify
