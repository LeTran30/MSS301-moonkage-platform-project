# Final gate for the web portal: every pull request must pass oxlint + type-check + build.
# Git hooks can be skipped (git commit --no-verify); CI cannot.
name: Web quality

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-quality.yml']
  push:
    branches: [main, develop]
    paths: ['web/**', '.github/workflows/web-quality.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint -- --deny-warnings

      # build: tsc -b (type-check) then vite build
      - name: Type-check and build
        run: npm run build
