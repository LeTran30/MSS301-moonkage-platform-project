# Template cho category "Q&A" trong GitHub Discussions.
# Tên file phải trùng slug của category (category Q&A mặc định có slug là "q-a").
# GitHub chỉ nhận discussion template dạng YAML form, không nhận .md.

title: "[Hỏi] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Mục này dành cho câu hỏi về cách dùng, cách làm, hoặc quy trình làm việc.
        Gặp lỗi thì mở **issue Báo lỗi**. Gặp lỗ hổng bảo mật thì **không** hỏi ở đây.

  - type: textarea
    id: question
    attributes:
      label: Câu hỏi
      description: Bạn muốn biết điều gì?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Bối cảnh
      description: Bạn đang làm gì, ở module nào, mục tiêu cuối cùng là gì?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: Đã thử những gì
      description: Cách đã thử, tài liệu đã đọc, kết quả nhận được.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "ví dụ: main @ a1b2c3d"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Trước khi hỏi
      options:
        - label: Tôi đã đọc CONTRIBUTING.md và AGENTS.md
          required: true
        - label: Tôi đã tìm trong các discussion và issue cũ
          required: true
        - label: Câu hỏi không chứa mật khẩu, token hay dữ liệu nhạy cảm
          required: true
