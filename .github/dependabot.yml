# Dependabot: tự đề xuất cập nhật dependency.
#
# Chính sách (CONTRIBUTING mục 16, 19):
# - Minor và patch được gom thành MỘT PR mỗi tuần cho mỗi hệ sinh thái để giảm nhiễu.
# - Major KHÔNG được tự mở PR. Nâng major do người làm chủ động.
# - Tiêu đề PR theo Conventional Commits: "chore(deps): bump ..." / "ci: bump ...".
# - PR mở vào develop như mọi nhánh làm việc (CONTRIBUTING mục 15), lên main theo đợt release.
# - PR của Dependabot vẫn cần người thật approve, không tự merge.

version: 2
updates:

  # ---------------------------------------------------------------------------
  # API: Maven multi-module, pom gốc ở api/
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # API: base image trong Dockerfile của từng service
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directories: ["/api/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Web portal: npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Mobile: Flutter (pub)
  # ---------------------------------------------------------------------------
  - package-ecosystem: pub
    directory: /mobile
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions: các action dùng trong .github/workflows/
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
