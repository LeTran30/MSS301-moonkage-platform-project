<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
    .email-container { width: 100%; background-color: #ffffff; padding: 20px; max-width: 600px; margin: 0 auto; border: 1px solid #dddddd; }
    .header { text-align: center; padding: 20px 0; background-color: #7a1f1f; color: #ffffff; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 20px; text-align: center; }
    .otp-box { display: inline-block; padding: 15px 30px; background-color: #d4a017; color: #ffffff; font-size: 28px; font-weight: bold; border-radius: 8px; margin: 20px 0; letter-spacing: 4px; }
    .footer { text-align: center; padding: 20px; font-size: 12px; color: #888888; }
  </style>
</head>
<body>
<div class="email-container">
  <div class="header">
    <h1>Mã xác nhận tài khoản</h1>
  </div>
  <div class="content">
    <p>Xin chào <strong>[[${name}]]</strong>,</p>
    <p>Mã OTP để xác nhận tài khoản MoonKage của bạn là:</p>
    <div class="otp-box">[[${otp}]]</div>
    <p>Mã có hiệu lực trong [[${minutes}]] phút. Không chia sẻ mã này với bất kỳ ai.</p>

  </div>
  <div class="footer">
    <p>Cảm ơn bạn đã sử dụng MoonKage – Marketplace quà Trung thu.</p>
  </div>
</div>
</body>
</html>
