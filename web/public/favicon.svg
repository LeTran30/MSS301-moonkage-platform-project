<svg role="img" aria-label="Moonkage — Mooncake Marketplace" xmlns="http://www.w3.org/2000/svg" viewBox="250 85 300 300">
  <defs>
    <style>
      .line { stroke: #e2b765; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gold { fill: #e2b765; }
      .gold-deep { fill: #b8893f; }
      .red { fill: #a83232; }
    </style>
  </defs>

  <!-- Nền vuông bo góc: giữ màu vàng đọc được trên tab sáng lẫn tối -->
  <rect x="250" y="85" width="300" height="300" rx="56" fill="#0d131a"/>

  <!-- Khung tròn ngoài -->
  <circle cx="400" cy="235" r="142" class="line" stroke-width="2" opacity="0.45"/>
  <circle cx="400" cy="235" r="134" class="line" stroke-width="1" opacity="0.2" stroke-dasharray="2 6"/>

  <!-- Hai nút kết nối Người Mua – Người Bán, nằm trên khung tròn -->
  <circle cx="258" cy="235" r="5" class="gold"/>
  <circle cx="542" cy="235" r="5" class="gold"/>

  <g id="logo-mark">
    <!-- Trăng khuyết ôm bánh -->
    <path d="M 370.8 145.9 A 96 96 0 1 0 492.1 257.1 A 84 84 0 1 1 370.8 145.9 Z" class="gold"/>

    <!-- Bánh trung thu: viền hoa 12 cánh -->
    <path d="M 412.0 172.0 A 15.2 15.2 0 0 1 440.0 179.5 A 15.2 15.2 0 0 1 460.5 200.0 A 15.2 15.2 0 0 1 468.0 228.0 A 15.2 15.2 0 0 1 460.5 256.0 A 15.2 15.2 0 0 1 440.0 276.5 A 15.2 15.2 0 0 1 412.0 284.0 A 15.2 15.2 0 0 1 384.0 276.5 A 15.2 15.2 0 0 1 363.5 256.0 A 15.2 15.2 0 0 1 356.0 228.0 A 15.2 15.2 0 0 1 363.5 200.0 A 15.2 15.2 0 0 1 384.0 179.5 A 15.2 15.2 0 0 1 412.0 172.0 Z" class="gold-deep"/>
    <path d="M 412.0 172.0 A 15.2 15.2 0 0 1 440.0 179.5 A 15.2 15.2 0 0 1 460.5 200.0 A 15.2 15.2 0 0 1 468.0 228.0 A 15.2 15.2 0 0 1 460.5 256.0 A 15.2 15.2 0 0 1 440.0 276.5 A 15.2 15.2 0 0 1 412.0 284.0 A 15.2 15.2 0 0 1 384.0 276.5 A 15.2 15.2 0 0 1 363.5 256.0 A 15.2 15.2 0 0 1 356.0 228.0 A 15.2 15.2 0 0 1 363.5 200.0 A 15.2 15.2 0 0 1 384.0 179.5 A 15.2 15.2 0 0 1 412.0 172.0 Z" class="line" stroke-width="2"/>
    <g transform="translate(412,228)">
      <circle r="40" fill="#0d131a" opacity="0.35"/>
      <circle r="40" class="line" stroke-width="1.5" stroke-dasharray="3 4"/>
      <g>
        <ellipse cx="0" cy="-17" rx="7" ry="13" transform="rotate(0)" class="line" stroke-width="1.6"/>
        <ellipse cx="0" cy="-17" rx="7" ry="13" transform="rotate(90)" class="line" stroke-width="1.6"/>
        <ellipse cx="0" cy="-17" rx="7" ry="13" transform="rotate(180)" class="line" stroke-width="1.6"/>
        <ellipse cx="0" cy="-17" rx="7" ry="13" transform="rotate(270)" class="line" stroke-width="1.6"/>
      </g>
      <circle r="6" class="red"/>
      <circle r="6" class="line" stroke-width="1.5"/>
    </g>

    <!-- Nón (chữ "Kage") đặt trên bánh -->
    <g transform="translate(412,0)">
      <path d="M -62 176 Q 0 166 62 176 L 0 128 Z" class="red"/>
      <path d="M -62 176 Q 0 166 62 176 L 0 128 Z" class="line" stroke-width="3"/>
      <path d="M 0 128 L -22 172 M 0 128 L 22 172" class="line" stroke-width="1.2" opacity="0.6"/>
      <circle cx="0" cy="128" r="4" class="gold"/>
    </g>
  </g>
</svg>
