server:
  port: 8084
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  datasource:
    url: "jdbc:postgresql://${ORDER_DB_HOST}:${ORDER_DB_PORT}/order_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# only health is exposed; liveness/readiness groups for the container healthcheck (RT-05)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
