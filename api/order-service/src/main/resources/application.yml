server:
  port: 8084
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  # all values come from the repo-root .env (see .env.example)
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
  datasource:
    url: "jdbc:postgresql://${ORDER_DB_HOST}:${ORDER_DB_PORT}/order_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    # off by default: every statement in the log is noise. Local debugging: JPA_SHOW_SQL=true in .env.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# only health is exposed; liveness/readiness groups for the container healthcheck (RT-05)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# domain events go through the outbox_events table (Software Design 6)
outbox:
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s

order:
  # P-01: the VNPay deadline of a checkout payment; checkout and stock hold last checkout-grace longer
  payment-lifetime: 15m
  checkout-grace: 5m
  checkout-expiry-sweep-interval: 60s
  # D-13, Q-10 (demo values): complaint window after delivery
  complaint-window-local: 3d
  complaint-window-other: 7d
