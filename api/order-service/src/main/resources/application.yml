server:
  port: 8084
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: order-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    openfeign:
      client:
        config:
          default:
            # DS-01: a call to another service must not hang forever
            connect-timeout: 2000
            read-timeout: 5000
  # all values come from the repo-root .env (see .env.example)
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
    # BE-11: the span of the publish and the span of the consume. The trace context travels in the "traceparent"
    # header of the message, so the consumer continues the trace of the request that wrote the event.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  datasource:
    url: "jdbc:postgresql://${ORDER_DB_HOST}:${ORDER_DB_PORT}/order_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # off by default: every statement in the log is noise. Local debugging: JPA_SHOW_SQL=true in .env.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  # BE-11: OpenTelemetry tracing. The span of the request travels with the request, so one trace covers the mobile
  # app, the gateway, this service and the events it publishes. The spans go to the OTel Collector over OTLP; the
  # Collector forwards them to Jaeger.
  tracing:
    # on by default; the switch exists so a deployment without a collector can turn it off
    enabled: ${TRACING_ENABLED:true}
    # how many of the traces are recorded. 1.0 records every trace (dev); a real deployment samples less.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # the trace context travels in the W3C header, the same one the HTTP calls and the AMQP messages use
    propagation:
      produce: [W3C]
      consume: [W3C]
  otlp:
    tracing:
      # the collector receives the spans over HTTP/protobuf
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  opentelemetry:
    # the resource attributes the collector groups the traces by
    resource-attributes:
      service.namespace: moonkage
      service.group: moonkage-platform
# domain events go through the outbox_events table (Software Design 6)
outbox:
  # the topic exchange every service publishes its domain events on (Software Design 5.4)
  exchange: moonkage.events
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s

order:
  # NFR-08: mockups, progress photos, invoices, evidence
  file:
    allowed-content-types: ${ORDER_FILE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,application/pdf}
    max-size: ${ORDER_FILE_MAX_SIZE:20MB}
    # fixed: it must match the prefix infra/minio/init.sh grants this service in the private bucket
    key-prefix: order
  # P-01: the VNPay deadline of a checkout payment; checkout and stock hold last checkout-grace longer
  payment-lifetime: 15m
  checkout-grace: 5m
  checkout-expiry-sweep-interval: 60s
  # D-13, Q-10 (demo values): complaint window after delivery
  complaint-window-local: 3d
  complaint-window-other: 7d
  # GET /api/orders/stats: days are cut in this zone; default and longest range, size of the top lists
  stats-zone: Asia/Ho_Chi_Minh
  stats-default-days: 30
  stats-max-days: 366
  stats-top-size: 5

storage:
  internal-url: "${MINIO_INTERNAL_URL:http://localhost:${MINIO_API_PORT}}"
  browser-url: "${MINIO_BROWSER_URL:http://localhost:${MINIO_API_PORT}}"
  # order's own MinIO user (infra/minio/init.sh): may only touch <private>/order/ and <private>/tmp/order/
  access-key: ${MINIO_ORDER_ACCESS_KEY}
  secret-key: ${MINIO_ORDER_SECRET_KEY}
  # required by common-storage; order-service never writes there
  public-bucket-name: ${MINIO_PUBLIC_BUCKET}
  # mockups, progress photos, invoices, dispute evidence: read through presigned links only (NFR-03)
  private-bucket-name: ${MINIO_PRIVATE_BUCKET}
  region: ${MINIO_REGION:us-east-1}
  # fixed: it must match the prefix infra/minio/init.sh grants this service
  temp-key-prefix: tmp/order
  upload-link-lifetime: ${MINIO_UPLOAD_LINK_LIFETIME:10m}
  download-link-lifetime: ${MINIO_DOWNLOAD_LINK_LIFETIME:10m}
