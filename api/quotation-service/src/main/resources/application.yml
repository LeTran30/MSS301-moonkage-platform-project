server:
  port: 8083
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: quotation-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    openfeign:
      client:
        config:
          default:
            # DS-01: a call to another service must not hang forever
            connect-timeout: 2000
            read-timeout: 5000
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
  datasource:
    url: "jdbc:postgresql://${QUOTATION_DB_HOST}:${QUOTATION_DB_PORT}/quotation_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

moonkage:
  quotation:
    # the buyer has this long on VNPay to pay a deposit; never past the quote's validity (L-10 step 4)
    deposit-payment-timeout: ${QUOTATION_DEPOSIT_PAYMENT_TIMEOUT:15m}
    # how often unpaid acceptances and quotes past validity are marked EXPIRED
    expiry-check-interval: PT1M

# domain events go through the outbox_events table (Software Design 6)
outbox:
  # the topic exchange every service publishes its domain events on (Software Design 5.4)
  exchange: moonkage.events
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s
