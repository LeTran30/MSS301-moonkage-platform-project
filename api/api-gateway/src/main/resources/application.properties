server.port=8080

spring.application.name=api-gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=${EUREKA_URL}
# register the container IP, not its random hostname, so the gateway can reach it inside Docker
eureka.instance.prefer-ip-address=true

# values come from the repo-root .env (see .env.example)
jwt.secret=${JWT_SECRET}

moonkage.cors.allowed-origins=${CORS_ORIGINS}

springdoc.webjars.prefix=

# Swagger UI for all services: http://localhost:8080/swagger-ui.html (pick a service top-right)
springdoc.swagger-ui.urls-primary-name=identity-service
springdoc.swagger-ui.urls[0].name=identity-service
springdoc.swagger-ui.urls[0].url=/identity-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=catalog-service
springdoc.swagger-ui.urls[1].url=/catalog-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=quotation-service
springdoc.swagger-ui.urls[2].url=/quotation-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=order-service
springdoc.swagger-ui.urls[3].url=/order-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=file-service
springdoc.swagger-ui.urls[4].url=/file-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=vendor-service
springdoc.swagger-ui.urls[5].url=/vendor-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=payment-service
springdoc.swagger-ui.urls[6].url=/payment-service/v3/api-docs
springdoc.swagger-ui.urls[7].name=notification-service
springdoc.swagger-ui.urls[7].url=/notification-service/v3/api-docs
