server.port=8087

spring.application.name=payment-service
spring.datasource.url=jdbc:postgresql://${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT}/payment_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=${EUREKA_URL}
# register the container IP, not its random hostname, so the gateway can reach it inside Docker
eureka.instance.prefer-ip-address=true
