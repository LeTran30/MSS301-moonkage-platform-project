server:
  port: 8087
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: payment-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # More than one thread for the scheduled tasks.
  #
  # Vì sao: mặc định của Spring Boot là **một** thread cho mọi `@Scheduled`.
  # Ở đây có hai việc định kỳ cùng dùng thread đó: `RefundJob` (quét hoàn tiền, gọi
  # ra VNPay — một hệ thống bên ngoài) và relay outbox (phát sự kiện của đơn).
  # Nếu lần gọi VNPay treo, relay outbox cũng ngừng theo ⇒ sự kiện của đơn không
  # đi nữa ⇒ đơn không bao giờ sang `PAID`. Với nhiều thread, một việc treo chỉ
  # chặn chính nó, và việc còn lại vẫn chạy.
  task:
    scheduling:
      pool:
        size: 2
  cloud:
    openfeign:
      client:
        config:
          default:
            # DS-01: a call to another service must not hang forever
            connect-timeout: 2000
            read-timeout: 5000
  # all values come from the repo-root .env (see .env.example)
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
    # BE-11: the span of the publish and the span of the consume. The trace context travels in the "traceparent"
    # header of the message, so the consumer continues the trace of the request that wrote the event.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  datasource:
    url: "jdbc:postgresql://${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT}/payment_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # off by default: every statement in the log is noise. Local debugging: JPA_SHOW_SQL=true in .env.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  # BE-11: OpenTelemetry tracing. The span of the request travels with the request, so one trace covers the mobile
  # app, the gateway, this service and the events it publishes. The spans go to the OTel Collector over OTLP; the
  # Collector forwards them to Jaeger.
  tracing:
    # on by default; the switch exists so a deployment without a collector can turn it off
    enabled: ${TRACING_ENABLED:true}
    # how many of the traces are recorded. 1.0 records every trace (dev); a real deployment samples less.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # the trace context travels in the W3C header, the same one the HTTP calls and the AMQP messages use
    propagation:
      produce: [W3C]
      consume: [W3C]
  otlp:
    tracing:
      # the collector receives the spans over HTTP/protobuf
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  opentelemetry:
    # the resource attributes the collector groups the traces by
    resource-attributes:
      service.namespace: moonkage
      service.group: moonkage-platform
# domain events go through the outbox_events table (Software Design 6)
outbox:
  # the topic exchange every service publishes its domain events on (Software Design 5.4)
  exchange: moonkage.events
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s

# VNPay sandbox (A-11); merchant values from sandbox.vnpayment.vn go in .env
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  # the web result page (M4.3); it forwards the query to GET /api/payments/vnpay/return
  # The default points at the portal in web/ (route /thanh-toan/ket-qua), which reads the
  # signed query and asks payment-service which payment it was.
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/thanh-toan/ket-qua}
  default-lifetime: 15m
  # true only where VNPay cannot call the IPN (localhost): the signed return query then counts as the IPN
  confirm-on-return: ${VNPAY_CONFIRM_ON_RETURN:false}
  # merchant_webapi: refunds (AC-49.3)
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  # Bao lâu thì bỏ một lần gọi hoàn tiền. Không đặt được là "chờ mãi" — lần gọi
  # nằm trong tác vụ định kỳ, nên nó phải có thời hạn (xem `VnpayRefundClient`).
  refund-timeout: ${VNPAY_REFUND_TIMEOUT:10s}

payment:
  # PENDING payments past expires_at become FAILED (payment.failed)
  expiry-sweep-interval: 60s
  # PENDING refunds are sent to VNPay; a refused one waits for an admin (MANUAL_REQUIRED)
  refund-interval: 30s
