server:
  port: 8081
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  # all values come from the repo-root .env (see .env.example)
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
  datasource:
    url: "jdbc:postgresql://${IDENTITY_DB_HOST}:${IDENTITY_DB_PORT}/identity_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
    # only db/seed uses it (dev): password of the seed accounts member#@mk.com; brackets keep the underscore
    placeholders:
      "[seed_password]": ${SEED_PASSWORD:}
      # and the pepper, so the seeded KYC results hash their ID numbers as the service does
      "[id_hash_pepper]": ${ID_HASH_PEPPER_V1:}
  jpa:
    hibernate:
      ddl-auto: validate
    # off by default: every statement in the log is noise and may carry personal data in literals.
    # Local debugging: JPA_SHOW_SQL=true in .env. The dialect is detected from the connection.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

otp:
  expiration: ${OTP_EXPIRATION}
  max-attempts: ${OTP_MAX_ATTEMPTS}
  resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
  max-resend-per-hour: ${OTP_MAX_RESEND_PER_HOUR:5}
  lockout-duration: ${OTP_LOCKOUT_DURATION:15m}
  cleanup-interval: 5m

# FR-04 KYC by NFC (Software Design 4.2): sessions, attempts and lockouts live in memory
nfc:
  session-ttl: ${NFC_SESSION_TTL:5m}
  max-attempts: ${NFC_MAX_ATTEMPTS:5}
  lockout-duration: ${NFC_LOCKOUT_DURATION:15m}
  session-cleanup-interval: 60s
  # secrets, identity-service only (D-08, D-17); stored hashes record key version 1
  transport-private-key: ${NFC_TRANSPORT_PRIVATE_KEY_V1:}
  id-hash-pepper: ${ID_HASH_PEPPER_V1:}

# domain events go through the outbox_events table (Software Design 6)
outbox:
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s

security:
  public-endpoints:
    - /error
    - /actuator/health/**
    - /internal/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/auth/register
    - /api/auth/verify-account
    - /api/auth/send-verify-account-otp
    - /api/auth/login
    - /api/auth/refresh-token
    - /api/auth/send-reset-password-otp
    - /api/auth/reset-password

# only health is exposed; liveness/readiness groups for the container healthcheck (RT-05)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
