server:
  port: 8081
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: identity-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # all values come from the repo-root .env (see .env.example)
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # OutboxRelay waits for the broker's confirm before marking an event sent
    publisher-confirm-type: simple
    # BE-11: the span of the publish and the span of the consume. The trace context travels in the "traceparent"
    # header of the message, so the consumer continues the trace of the request that wrote the event.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  datasource:
    url: "jdbc:postgresql://${IDENTITY_DB_HOST}:${IDENTITY_DB_PORT}/identity_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
    # only db/seed uses it (dev): password of the seed accounts member#@mk.com; brackets keep the underscore
    placeholders:
      "[seed_password]": ${SEED_PASSWORD:}
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # off by default: every statement in the log is noise and may carry personal data in literals.
    # Local debugging: JPA_SHOW_SQL=true in .env. The dialect is detected from the connection.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

otp:
  expiration: ${OTP_EXPIRATION}
  max-attempts: ${OTP_MAX_ATTEMPTS}
  min: 100000
  range: 900000
  resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
  max-resend-per-hour: ${OTP_MAX_RESEND_PER_HOUR:5}
  lockout-duration: ${OTP_LOCKOUT_DURATION:15m}
  cleanup-interval: 5m

# FR-04 NFC verification (Software Design 4.2): sessions live in memory, lockout is kept on the account
nfc:
  session-ttl: ${NFC_SESSION_TTL:5m}
  max-attempts: ${NFC_MAX_ATTEMPTS:5}
  lockout-duration: ${NFC_LOCKOUT_DURATION:15m}
  session-cleanup-interval: 60s
  # secrets, identity-service only (D-08, D-17); stored rows record key version 1
  transport-private-key: ${NFC_TRANSPORT_PRIVATE_KEY_V1:}
  pii-key: ${PII_ENC_KEY_V1:}
  id-hash-pepper: ${ID_HASH_PEPPER_V1:}

# domain events go through the outbox_events table (Software Design 6)
outbox:
  # the topic exchange every service publishes its domain events on (Software Design 5.4)
  exchange: moonkage.events
  relay-interval: 2s
  batch-size: 100
  confirm-timeout: 5s

security:
  public-endpoints:
    - /error
    - /actuator/health/**
    - /internal/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/auth/register
    - /api/auth/verify-account
    - /api/auth/send-verify-account-otp
    - /api/auth/login
    - /api/auth/refresh-token
    - /api/auth/send-reset-password-otp
    - /api/auth/reset-password

app:
  # dev seed data (db/seed, docs/guides/database.md); true only in docker-compose
  seed:
    enabled: ${APP_SEED_ENABLED:false}

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # BE-11: OpenTelemetry tracing. The span of the request travels with the request, so one trace covers the mobile
  # app, the gateway, this service and the events it publishes. The spans go to the OTel Collector over OTLP; the
  # Collector forwards them to Jaeger.
  tracing:
    # on by default; the switch exists so a deployment without a collector can turn it off
    enabled: ${TRACING_ENABLED:true}
    # how many of the traces are recorded. 1.0 records every trace (dev); a real deployment samples less.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # the trace context travels in the W3C header, the same one the HTTP calls and the AMQP messages use
    propagation:
      produce: [W3C]
      consume: [W3C]
  otlp:
    tracing:
      # the collector receives the spans over HTTP/protobuf
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  opentelemetry:
    # the resource attributes the collector groups the traces by
    resource-attributes:
      service.namespace: moonkage
      service.group: moonkage-platform
