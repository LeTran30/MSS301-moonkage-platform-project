server:
  port: 8081
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  # all values come from the repo-root .env (see .env.example)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: "true"
          starttls:
            enable: "true"
  datasource:
    url: "jdbc:postgresql://${IDENTITY_DB_HOST}:${IDENTITY_DB_PORT}/identity_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: "true"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

otp:
  expiration: ${OTP_EXPIRATION}
  max-attempts: ${OTP_MAX_ATTEMPTS}

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  # demo seller with an approved Shop (DataInitializer)
  seller:
    email: "${SELLER_EMAIL:seller@moonkage.vn}"
    password: "${SELLER_PASSWORD:Seller@123}"
