# FreezingArchRule (DomainModelArchitectureTest): violations that existed when a rule was added are recorded here and
# tolerated; new ones fail. The store shrinks as the code is fixed: commit its change together with the fix.
freeze.store.default.path=src/test/resources/archunit_store
# The store was recorded once (2026-10-29). false: a deleted store fails instead of silently accepting everything.
# A new frozen rule needs true for one local run, then back to false.
freeze.store.default.allowStoreCreation=false
