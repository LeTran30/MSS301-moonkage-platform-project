server.port=8085

spring.application.name=file-service

# trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
server.forward-headers-strategy=framework
server.error.include-message=always

# per file / per request; FileServiceImpl enforces the same 5MB per file
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

eureka.client.service-url.defaultZone=${EUREKA_URL}
# register the container IP, not its random hostname, so the gateway can reach it inside Docker
eureka.instance.prefer-ip-address=true

# values come from the repo-root .env (see .env.example)
# url = how this service reaches MinIO (docker compose sets MINIO_URL=http://minio:9000);
# public-url = how a browser reaches it
minio.url=${MINIO_URL:http://localhost:${MINIO_API_PORT}}
minio.public-url=http://localhost:${MINIO_API_PORT}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket-name=${MINIO_BUCKET_NAME}
