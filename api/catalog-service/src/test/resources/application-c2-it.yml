spring:
  datasource:
    url: jdbc:postgresql://localhost/unused
    username: test
    password: test
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
        prefetch: 1
EUREKA_URL: http://localhost:8761/eureka/
eureka:
  client:
    enabled: false
catalog:
  outbox:
    enabled: false
  projections:
    capture-enabled: true
