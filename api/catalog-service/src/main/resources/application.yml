server:
  port: 8082
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: catalog-service
  # error texts of common-storage (StorageErrorCode)
  messages:
    basename: storage-messages
  datasource:
    url: "jdbc:postgresql://${CATALOG_DB_HOST}:${CATALOG_DB_PORT}/catalog_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

# values come from the repo-root .env (see .env.example)
# internal-url = how this service reaches MinIO (docker compose sets MINIO_INTERNAL_URL=http://minio:9000);
# browser-url = how a browser reaches it (product image URLs and presigned upload links)
storage:
  internal-url: "${MINIO_INTERNAL_URL:http://localhost:${MINIO_API_PORT}}"
  browser-url: "${MINIO_BROWSER_URL:http://localhost:${MINIO_API_PORT}}"
  # catalog's own MinIO user (infra/minio/init.sh): may only touch <public>/products/ and <private>/tmp/catalog/
  access-key: ${MINIO_CATALOG_ACCESS_KEY}
  secret-key: ${MINIO_CATALOG_SECRET_KEY}
  public-bucket-name: ${MINIO_PUBLIC_BUCKET}
  private-bucket-name: ${MINIO_PRIVATE_BUCKET}
  region: ${MINIO_REGION:us-east-1}
  # fixed: it must match the prefix infra/minio/init.sh grants this service
  temp-key-prefix: tmp/catalog
  upload-link-lifetime: ${MINIO_UPLOAD_LINK_LIFETIME:10m}
  download-link-lifetime: ${MINIO_DOWNLOAD_LINK_LIFETIME:10m}

catalog:
  product-image:
    allowed-content-types: ${PRODUCT_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    max-size: ${PRODUCT_IMAGE_MAX_SIZE:5MB}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# only health is exposed; liveness/readiness groups for the container healthcheck (RT-05)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
