server:
  port: 8082
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: catalog-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "jdbc:postgresql://${CATALOG_DB_HOST}:${CATALOG_DB_PORT}/catalog_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # BE-11: the span of the publish and the span of the consume. The trace context travels in the "traceparent"
      # header of the message, so the consumer continues the trace of the request that wrote the event.
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

# values come from the repo-root .env (see .env.example)
# catalog only renders the public image URLs of the products it copies; it never touches MinIO itself (BE-09).
moonkage:
  common-api:
    error-handler:
      # catalog keeps its own error boundary: it answers the ApiResponse envelope on every path, with its own
      # CAT_* codes (audit M-03, backlog P1-5). The shared boundary would answer the envelope with the COMMON_*
      # codes on every path, so it is off here.
      enabled: false
catalog:
  projections:
    capture-enabled: true
    # apply captured inbox events to the read model (PendingInboxProjector)
    apply-enabled: true
    apply-interval: 1s
    apply-batch-size: 100
    apply-max-pages: 10
  public-images:
    base-url: "${MINIO_BROWSER_URL:http://localhost:${MINIO_API_PORT:9000}}"
    bucket: "${MINIO_PUBLIC_BUCKET:moonkage-public}"
  outbox:
    enabled: true
    relay-interval: 2s
    batch-size: 25

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # BE-11: OpenTelemetry tracing. The span of the request travels with the request, so one trace covers the mobile
  # app, the gateway, this service and the events it publishes. The spans go to the OTel Collector over OTLP; the
  # Collector forwards them to Jaeger.
  tracing:
    # on by default; the switch exists so a deployment without a collector can turn it off
    enabled: ${TRACING_ENABLED:true}
    # how many of the traces are recorded. 1.0 records every trace (dev); a real deployment samples less.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # the trace context travels in the W3C header, the same one the HTTP calls and the AMQP messages use
    propagation:
      produce: [W3C]
      consume: [W3C]
  otlp:
    tracing:
      # the collector receives the spans over HTTP/protobuf
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  opentelemetry:
    # the resource attributes the collector groups the traces by
    resource-attributes:
      service.namespace: moonkage
      service.group: moonkage-platform
