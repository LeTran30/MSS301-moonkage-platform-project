server:
  port: 8088
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework

spring:
  application:
    name: orchestrator-service
  datasource:
    url: "jdbc:postgresql://${ORCHESTRATOR_DB_HOST}:${ORCHESTRATOR_DB_PORT}/orchestrator_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Mail configuration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: "true"
          starttls:
            enable: "true"
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          # a message that still fails after 3 tries is dropped (logged), not requeued forever
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false

# STOMP over WebSocket at /ws (through the gateway): the access token is checked on CONNECT
jwt:
  # same Base64 HS256 key as identity-service and api-gateway
  secret: ${JWT_SECRET}

moonkage:
  cors:
    # browsers allowed to open the WebSocket (Origin check of the handshake)
    allowed-origins: ${CORS_ORIGINS}
  mail:
    # never send real mail to these domains: the dev seed accounts are member#@mk.com, a real domain
    # (docs/guides/database.md). The email is only logged, as when no mail host is set.
    blocked-domains: mk.com

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# only health is exposed; liveness/readiness groups for the container healthcheck (RT-05)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
