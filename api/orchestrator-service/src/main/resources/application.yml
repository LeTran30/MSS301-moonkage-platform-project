server:
  port: 8088
  # trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
  forward-headers-strategy: framework
  # RT-02: finish the requests in flight before the container stops
  shutdown: graceful

spring:
  application:
    name: orchestrator-service
  # RT-02: how long the container waits for the requests in flight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "jdbc:postgresql://${ORCHESTRATOR_DB_HOST}:${ORCHESTRATOR_DB_PORT}/orchestrator_db"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema changes are Flyway migrations (docs/guides/database.md); Hibernate only checks the entities match
  flyway:
    locations: classpath:db/migration
    # a database created before Flyway (by ddl-auto) counts as V1__baseline already applied
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # no lazy loading in the web layer: every query the response needs is written out (DP-02)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Mail configuration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: "true"
          starttls:
            enable: "true"
  # RabbitMQ (domain events, Software Design 5.4)
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # BE-11: the span of the consume. The trace context travels in the "traceparent" header of the message.
        observation-enabled: true
        retry:
          # a message that still fails after 3 tries is dropped (logged), not requeued forever
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false

# STOMP over WebSocket at /ws (through the gateway): the access token is checked on CONNECT
jwt:
  # same Base64 HS256 key as identity-service and api-gateway
  secret: ${JWT_SECRET}

moonkage:
  cors:
    # browsers allowed to open the WebSocket (Origin check of the handshake)
    allowed-origins: ${CORS_ORIGINS}
  mail:
    # never send real mail to these domains: the dev seed accounts are member#@mk.com, a real domain
    # (docs/guides/database.md). The email is only logged, as when no mail host is set.
    blocked-domains: mk.com

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    # register the container IP, not its random hostname, so the gateway can reach it inside Docker
    prefer-ip-address: true

# health for the container healthcheck (RT-05); prometheus for the metrics (BE-11b)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # BE-11: OpenTelemetry tracing. The span of the request travels with the request, so one trace covers the mobile
  # app, the gateway, this service and the events it publishes. The spans go to the OTel Collector over OTLP; the
  # Collector forwards them to Jaeger.
  tracing:
    # on by default; the switch exists so a deployment without a collector can turn it off
    enabled: ${TRACING_ENABLED:true}
    # how many of the traces are recorded. 1.0 records every trace (dev); a real deployment samples less.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # the trace context travels in the W3C header, the same one the HTTP calls and the AMQP messages use
    propagation:
      produce: [W3C]
      consume: [W3C]
  otlp:
    tracing:
      # the collector receives the spans over HTTP/protobuf
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  opentelemetry:
    # the resource attributes the collector groups the traces by
    resource-attributes:
      service.namespace: moonkage
      service.group: moonkage-platform
