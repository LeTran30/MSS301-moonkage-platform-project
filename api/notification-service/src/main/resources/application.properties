server.port=8088

spring.application.name=notification-service
spring.datasource.url=jdbc:postgresql://${NOTIFICATION_DB_HOST}:${NOTIFICATION_DB_PORT}/notification_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=${EUREKA_URL}
# register the container IP, not its random hostname, so the gateway can reach it inside Docker
eureka.instance.prefer-ip-address=true

# RabbitMQ (domain events, Software Design 5.4)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# a message that still fails after 3 tries is dropped (logged), not requeued forever
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
