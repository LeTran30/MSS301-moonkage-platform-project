server.port=8086

spring.application.name=vendor-service
spring.datasource.url=jdbc:postgresql://${VENDOR_DB_HOST}:${VENDOR_DB_PORT}/vendor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# trust X-Forwarded-* from the gateway so Swagger "Try it out" calls go through http://localhost:8080/<service>
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=${EUREKA_URL}
# register the container IP, not its random hostname, so the gateway can reach it inside Docker
eureka.instance.prefer-ip-address=true

# demo seller account seeded by identity-service; DemoVendorSeeder gives it an approved Shop
app.seller.email=${SELLER_EMAIL:seller@moonkage.vn}
