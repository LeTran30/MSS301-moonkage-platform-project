# =============================================
# Moonkage - full stack
#   Everything:          docker compose up -d --build
#   Only the databases:  docker compose up -d identity-db catalog-db quotation-db order-db vendor-db payment-db orchestrator-db minio minio-init rabbitmq
#                        (then run the services from the IDE / mvn)
# Values come from .env in this folder (see .env.example).
# =============================================
name: moonkage

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  networks: [moonkage-network]

# Each service lists only the variables it reads (least privilege): no container gets the whole .env, so
# e.g. catalog never sees the JWT key, the ID pepper or the MinIO root account.
#   - VAR        value from .env; left out of the container when .env does not set it, so the default in
#                application.yml still applies
#   - VAR=value  fixed for the Docker network (database host, Eureka URL…)
# When a service starts reading a new variable, add it to its list here.
x-app: &app
  restart: unless-stopped
  networks: [moonkage-network]

services:
  # ───────────── Databases: one PostgreSQL per service ─────────────
  identity-db:
    <<: *postgres
    container_name: moonkage-identity-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: identity_db
    ports: ["${IDENTITY_DB_PORT}:5432"]
    volumes: [identity-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    <<: *postgres
    container_name: moonkage-catalog-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: catalog_db
    ports: ["${CATALOG_DB_PORT}:5432"]
    volumes: [catalog-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  quotation-db:
    <<: *postgres
    container_name: moonkage-quotation-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: quotation_db
    ports: ["${QUOTATION_DB_PORT}:5432"]
    volumes: [quotation-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    <<: *postgres
    container_name: moonkage-order-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: order_db
    ports: ["${ORDER_DB_PORT}:5432"]
    volumes: [order-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vendor-db:
    <<: *postgres
    container_name: moonkage-vendor-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vendor_db
    ports: ["${VENDOR_DB_PORT}:5432"]
    volumes: [vendor-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    <<: *postgres
    container_name: moonkage-payment-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: payment_db
    ports: ["${PAYMENT_DB_PORT}:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator-db:
    <<: *postgres
    container_name: moonkage-orchestrator-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: orchestrator_db
    ports: ["${ORCHESTRATOR_DB_PORT}:5432"]
    volumes: [orchestrator-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────── File storage (services that own files sign MinIO links themselves) ─────────────
  minio:
    image: chainguard/minio:latest
    container_name: moonkage-minio
    restart: unless-stopped
    networks: [moonkage-network]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # 9000 = API (the browser loads files from here), 9001 = web console
    ports: ["${MINIO_API_PORT}:9000", "${MINIO_CONSOLE_PORT}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs once with the root account: buckets, lifecycle, and one MinIO user per service limited to its own
  # key prefixes (infra/minio/init.sh). Services get only their own user, never the root account.
  minio-init:
    image: chainguard/minio:latest
    container_name: moonkage-minio-init
    restart: "no"
    networks: [moonkage-network]
    entrypoint: ["sh", "/init/init.sh"]
    volumes: ["./infra/minio/init.sh:/init/init.sh:ro"]
    environment:
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET}
      MINIO_VENDOR_DOCS_BUCKET: ${MINIO_VENDOR_DOCS_BUCKET}
      MINIO_TEMP_RETENTION_DAYS: ${MINIO_TEMP_RETENTION_DAYS:-1}
      MINIO_CATALOG_ACCESS_KEY: ${MINIO_CATALOG_ACCESS_KEY}
      MINIO_CATALOG_SECRET_KEY: ${MINIO_CATALOG_SECRET_KEY}
      MINIO_ORDER_ACCESS_KEY: ${MINIO_ORDER_ACCESS_KEY}
      MINIO_ORDER_SECRET_KEY: ${MINIO_ORDER_SECRET_KEY}
      MINIO_VENDOR_ACCESS_KEY: ${MINIO_VENDOR_ACCESS_KEY}
      MINIO_VENDOR_SECRET_KEY: ${MINIO_VENDOR_SECRET_KEY}
    depends_on:
      minio: { condition: service_healthy }

  # ───────────── Message broker (domain events, Software Design 5.4) ─────────────
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: moonkage-rabbitmq
    restart: unless-stopped
    networks: [moonkage-network]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # 5672 = AMQP, 15672 = management UI
    ports: ["${RABBITMQ_PORT}:5672", "${RABBITMQ_MANAGEMENT_PORT}:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────── Infrastructure services ─────────────
  discovery-server:
    <<: *app
    container_name: moonkage-discovery-server
    build: { context: ./api, dockerfile: discovery-server/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    <<: *app
    container_name: moonkage-api-gateway
    build: { context: ./api, dockerfile: api-gateway/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - JWT_SECRET
      - CORS_ORIGINS
      - GATEWAY_TRUSTED_PROXIES
    # the only business entry point exposed to the host; other services are reachable only through it
    ports: ["8080:8080"]
    depends_on:
      discovery-server: { condition: service_healthy }

  # ───────────── Business services (no host ports: go through the gateway) ─────────────
  identity-service:
    <<: *app
    container_name: moonkage-identity-service
    build: { context: ./api, dockerfile: identity-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - IDENTITY_DB_HOST=identity-db
      - IDENTITY_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - SEED_PASSWORD
      - APP_SEED_ENABLED=true
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      - JPA_SHOW_SQL
      - JWT_SECRET
      - JWT_EXPIRATION
      - JWT_REFRESH_EXPIRATION
      - OTP_EXPIRATION
      - OTP_MAX_ATTEMPTS
      - OTP_LOCKOUT_DURATION
      - OTP_RESEND_COOLDOWN
      - OTP_MAX_RESEND_PER_HOUR
      - NFC_SESSION_TTL
      - NFC_MAX_ATTEMPTS
      - NFC_LOCKOUT_DURATION
      - NFC_TRANSPORT_PRIVATE_KEY_V1
      - PII_ENC_KEY_V1
      - ID_HASH_PEPPER_V1
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      identity-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  catalog-service:
    <<: *app
    container_name: moonkage-catalog-service
    build: { context: ./api, dockerfile: catalog-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - CATALOG_DB_HOST=catalog-db
      - CATALOG_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      # catalog's own MinIO user only, never the root account (infra/minio/init.sh)
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_API_PORT
      - MINIO_BROWSER_URL
      - MINIO_REGION
      - MINIO_CATALOG_ACCESS_KEY
      - MINIO_CATALOG_SECRET_KEY
      - MINIO_PUBLIC_BUCKET
      - MINIO_PRIVATE_BUCKET
      - MINIO_UPLOAD_LINK_LIFETIME
      - MINIO_DOWNLOAD_LINK_LIFETIME
      - PRODUCT_IMAGE_ALLOWED_CONTENT_TYPES
      - PRODUCT_IMAGE_MAX_SIZE
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      catalog-db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      discovery-server: { condition: service_healthy }

  quotation-service:
    <<: *app
    container_name: moonkage-quotation-service
    build: { context: ./api, dockerfile: quotation-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - QUOTATION_DB_HOST=quotation-db
      - QUOTATION_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      quotation-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  order-service:
    <<: *app
    container_name: moonkage-order-service
    build: { context: ./api, dockerfile: order-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - ORDER_DB_HOST=order-db
      - ORDER_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      order-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  vendor-service:
    <<: *app
    container_name: moonkage-vendor-service
    build: { context: ./api, dockerfile: vendor-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - VENDOR_DB_HOST=vendor-db
      - VENDOR_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      # vendor's own MinIO user only, never the root account (infra/minio/init.sh)
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_API_PORT
      - MINIO_BROWSER_URL
      - MINIO_REGION
      - MINIO_VENDOR_ACCESS_KEY
      - MINIO_VENDOR_SECRET_KEY
      - MINIO_PUBLIC_BUCKET
      - MINIO_VENDOR_DOCS_BUCKET
      - MINIO_UPLOAD_LINK_LIFETIME
      - MINIO_DOWNLOAD_LINK_LIFETIME
      - VENDOR_DOCUMENT_ALLOWED_CONTENT_TYPES
      - VENDOR_DOCUMENT_MAX_SIZE
      # secret, vendor-service only (P-09)
      - BANK_ACCOUNT_ENC_KEY_V1
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      vendor-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      discovery-server: { condition: service_healthy }

  payment-service:
    <<: *app
    container_name: moonkage-payment-service
    build: { context: ./api, dockerfile: payment-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - PAYMENT_DB_HOST=payment-db
      - PAYMENT_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      # VNPay sandbox (A-11): merchant values from sandbox.vnpayment.vn
      - VNPAY_TMN_CODE
      - VNPAY_HASH_SECRET
      - VNPAY_PAY_URL
      - VNPAY_RETURN_URL
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8087/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      payment-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  orchestrator-service:
    <<: *app
    container_name: moonkage-orchestrator-service
    build: { context: ./api, dockerfile: orchestrator-service/Dockerfile }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_USERNAME
      - DB_PASSWORD
      - ORCHESTRATOR_DB_HOST=orchestrator-db
      - ORCHESTRATOR_DB_PORT=5432
      # dev seed data: db/seed of the service, run by Flyway after the migrations (docs/guides/database.md)
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      - JWT_SECRET
      - CORS_ORIGINS
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
    # readiness only (no DB/mail checks), so a slow SMTP does not mark the service unhealthy (RT-05)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8088/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      orchestrator-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

volumes:
  identity-db-data:
  catalog-db-data:
  quotation-db-data:
  order-db-data:
  vendor-db-data:
  payment-db-data:
  orchestrator-db-data:
  minio-data:
  rabbitmq-data:

networks:
  moonkage-network:
    driver: bridge
