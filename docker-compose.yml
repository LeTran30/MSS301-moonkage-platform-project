# =============================================
# Moonkage - full stack
#   Everything:          docker compose up -d --build
#   Only the databases:  docker compose up -d identity-db catalog-db quotation-db order-db vendor-db payment-db notification-db minio rabbitmq
#                        (then run the services from the IDE / mvn)
# Values come from .env in this folder (see .env.example).
# =============================================
name: moonkage

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  networks: [moonkage-network]

x-app: &app
  restart: unless-stopped
  env_file: .env
  networks: [moonkage-network]

x-app-env: &app-env
  EUREKA_URL: http://discovery-server:8761/eureka/
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  TZ: Asia/Ho_Chi_Minh

services:
  # ───────────── Databases: one PostgreSQL per service ─────────────
  identity-db:
    <<: *postgres
    container_name: moonkage-identity-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: identity_db
    ports: ["${IDENTITY_DB_PORT}:5432"]
    volumes: [identity-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    <<: *postgres
    container_name: moonkage-catalog-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: catalog_db
    ports: ["${CATALOG_DB_PORT}:5432"]
    volumes: [catalog-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  quotation-db:
    <<: *postgres
    container_name: moonkage-quotation-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: quotation_db
    ports: ["${QUOTATION_DB_PORT}:5432"]
    volumes: [quotation-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    <<: *postgres
    container_name: moonkage-order-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: order_db
    ports: ["${ORDER_DB_PORT}:5432"]
    volumes: [order-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vendor-db:
    <<: *postgres
    container_name: moonkage-vendor-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vendor_db
    ports: ["${VENDOR_DB_PORT}:5432"]
    volumes: [vendor-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    <<: *postgres
    container_name: moonkage-payment-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: payment_db
    ports: ["${PAYMENT_DB_PORT}:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    <<: *postgres
    container_name: moonkage-notification-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notification_db
    ports: ["${NOTIFICATION_DB_PORT}:5432"]
    volumes: [notification-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────── File storage (used only by file-service) ─────────────
  minio:
    image: chainguard/minio:latest
    container_name: moonkage-minio
    restart: unless-stopped
    networks: [moonkage-network]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # 9000 = API (the browser loads files from here), 9001 = web console
    ports: ["${MINIO_API_PORT}:9000", "${MINIO_CONSOLE_PORT}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────── Message broker (domain events, Software Design 5.4) ─────────────
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: moonkage-rabbitmq
    restart: unless-stopped
    networks: [moonkage-network]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # 5672 = AMQP, 15672 = management UI
    ports: ["${RABBITMQ_PORT}:5672", "${RABBITMQ_MANAGEMENT_PORT}:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────── Infrastructure services ─────────────
  discovery-server:
    <<: *app
    container_name: moonkage-discovery-server
    build: { context: ./api, dockerfile: discovery-server/Dockerfile }
    environment: { TZ: Asia/Ho_Chi_Minh }
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    <<: *app
    container_name: moonkage-api-gateway
    build: { context: ./api, dockerfile: api-gateway/Dockerfile }
    environment: *app-env
    # the only business entry point exposed to the host; other services are reachable only through it
    ports: ["8080:8080"]
    depends_on:
      discovery-server: { condition: service_healthy }

  # ───────────── Business services (no host ports: go through the gateway) ─────────────
  identity-service:
    <<: *app
    container_name: moonkage-identity-service
    build: { context: ./api, dockerfile: identity-service/Dockerfile }
    environment:
      <<: *app-env
      IDENTITY_DB_HOST: identity-db
      IDENTITY_DB_PORT: 5432
    depends_on:
      identity-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  catalog-service:
    <<: *app
    container_name: moonkage-catalog-service
    build: { context: ./api, dockerfile: catalog-service/Dockerfile }
    environment:
      <<: *app-env
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
    depends_on:
      catalog-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  quotation-service:
    <<: *app
    container_name: moonkage-quotation-service
    build: { context: ./api, dockerfile: quotation-service/Dockerfile }
    environment:
      <<: *app-env
      QUOTATION_DB_HOST: quotation-db
      QUOTATION_DB_PORT: 5432
    depends_on:
      quotation-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  order-service:
    <<: *app
    container_name: moonkage-order-service
    build: { context: ./api, dockerfile: order-service/Dockerfile }
    environment:
      <<: *app-env
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
    depends_on:
      order-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  file-service:
    <<: *app
    container_name: moonkage-file-service
    build: { context: ./api, dockerfile: file-service/Dockerfile }
    environment:
      <<: *app-env
      MINIO_URL: http://minio:9000
    depends_on:
      minio: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  vendor-service:
    <<: *app
    container_name: moonkage-vendor-service
    build: { context: ./api, dockerfile: vendor-service/Dockerfile }
    environment:
      <<: *app-env
      VENDOR_DB_HOST: vendor-db
      VENDOR_DB_PORT: 5432
    depends_on:
      vendor-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  payment-service:
    <<: *app
    container_name: moonkage-payment-service
    build: { context: ./api, dockerfile: payment-service/Dockerfile }
    environment:
      <<: *app-env
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PORT: 5432
    depends_on:
      payment-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  notification-service:
    <<: *app
    container_name: moonkage-notification-service
    build: { context: ./api, dockerfile: notification-service/Dockerfile }
    environment:
      <<: *app-env
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PORT: 5432
    depends_on:
      notification-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

volumes:
  identity-db-data:
  catalog-db-data:
  quotation-db-data:
  order-db-data:
  vendor-db-data:
  payment-db-data:
  notification-db-data:
  minio-data:
  rabbitmq-data:

networks:
  moonkage-network:
    driver: bridge
